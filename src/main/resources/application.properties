spring.application.name=ecommerce-backend

# Database connection (Docker PostgreSQL on port 5433)
spring.datasource.url=jdbc:postgresql://localhost:5433/ecommerce_db
spring.datasource.username=ecommerce_user
spring.datasource.password=ecommerce_pass

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# JWT (outside development, override the secret with the JWT_SECRET environment variable)
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-use-at-least-32-chars}
app.jwt.expiration-minutes=60